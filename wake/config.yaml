models:
  describe: "Claude Sonnet 4.6"
  classify: "Claude Sonnet 4.6"
  pdf_abstract_extract: "Claude Sonnet 4.6"
  evidence: "Claude Sonnet 4.6"

openalex:
  rate_limit_s: 1.0
  per_page: 200
  mailto_default: "rross@anl.gov"

# Lazy abstract backfill: when a citing work selected for classification has
# no OpenAlex abstract, try these sources in order before falling back to
# title+venue-only classification. Tried once per citing work; result is
# cached in the classify sidecar (abstract_source field) so it's never
# re-fetched. Primo first (see the commented block below -- inactive unless
# configured, since it's an institution-specific endpoint); OSTI next
# (free, no rate limit, high precision but DOE-only coverage); Semantic
# Scholar last (unauthenticated, ~100 req/5min, broader coverage). All
# three return None quickly on a miss.
abstract_backfill:
  enabled: true
  sources: [primo, osti, semanticscholar]
  rate_limit_s:
    primo: 0.2
    osti: 0.5
    semanticscholar: 1.2

  # Ex Libris Primo discovery-layer lookup (wake/sources/primo.py) --
  # OPT-IN, disabled by default. Primo aggregates publisher metadata
  # (Elsevier, Springer, IEEE, ACM, ...) behind a single institutional
  # endpoint and tolerates a much higher request rate than OSTI/Semantic
  # Scholar in practice, but the endpoint below is specific to ONE
  # institution's library subscription -- it must never be a shared
  # default, or every wake install would silently query someone else's
  # Primo instance. Leave this whole block absent/disabled and instead
  # set these as environment variables (WAKE_PRIMO_BASE_URL, _VID, _INST,
  # _SCOPE -- see docs/abstract-recovery.md) in your own .env/shell; env
  # vars always take precedence over this block, so nothing institution-
  # specific ever needs to be committed here. The example below shows the
  # shape only -- replace with your own library's Primo details if you'd
  # rather configure via file than environment.
  # primo:
  #   enabled: false
  #   base_url: "https://your-institution.primo.exlibrisgroup.com"
  #   vid: "01YOUR_INST:01YOUR_INST"
  #   inst: "01YOUR_INST"
  #   scope: "MyInst_and_CI"
  #   # Accept a title-only match (DOI-less works) only above this
  #   # similarity ratio -- guards against a generic title returning an
  #   # unrelated top hit.
  #   title_similarity_threshold: 0.85
  #   # When true, Primo's abstract is preferred over OpenAlex's own
  #   # (reconstructed-from-inverted-index) abstract for EVERY citing
  #   # work, not just ones OpenAlex left abstract-less -- Primo's
  #   # publisher-sourced abstracts are frequently more complete. A Primo
  #   # miss in this mode keeps OpenAlex's abstract rather than falling
  #   # through to OSTI/Semantic Scholar.
  #   prefer_over_openalex: true

# Human-driven escalation for high-value citing works that automatic
# backfill (OSTI/Semantic Scholar) couldn't recover an abstract for. See
# `wake gaps` (surface candidates) and `wake fill-abstract` (resolve one).
gaps:
  # A no-abstract work is worth surfacing to the human if its own
  # cited_by_count is at least this — below the threshold, title+venue-only
  # classification is judged good enough and not worth the escalation.
  min_cited_by_count: 20
  default_limit: 10

pdf_extract:
  max_pages: 3
  prompt_version: "pdf-abstract-1"

# PDF acquisition chain (wake fetch-pdf): tried in order, all API-based
# (no scraping publisher landing pages, no sci-hub-style sources).
# openalex_oa first -- the work's own best_oa_location.pdf_url, already
# captured for free at `wake citing`/resolve time (see
# sources/openalex.py); no network call, just reads a field, so it costs
# nothing to try first and only ever helps. OSTI next (DOE-funded work,
# direct PDF, no auth wall); Semantic Scholar and Unpaywall after that
# (broader OA aggregation, some URLs 403 bot downloads); Springer's
# predictable-URL guess; arXiv for preprints; primo second-to-last --
# opt-in (see abstract_backfill.primo above), and deliberately late: its
# OA PDF links only ever cover records already open access, which the
# earlier sources already target, so it's a smaller-long-tail fallback,
# not a primary source (silently skipped entirely if Primo isn't
# configured); CORE last and optional (needs CORE_API_KEY, silently
# skipped if unset). On full failure, returns human-actionable links
# instead (Unpaywall lookup page, Google Scholar search, publisher DOI,
# CORE search).
pdf_fetch:
  sources: [openalex_oa, osti, semanticscholar, unpaywall, springer, arxiv, primo, core]
  rate_limit_s:
    osti: 0.5
    semanticscholar: 1.2
    unpaywall: 0.5
    springer: 0.5
    arxiv: 3.0
    primo: 0.2
    core: 1.0
  download_timeout_s: 30
  # A downloaded file below this size is treated as a failed fetch (e.g. an
  # HTML error/paywall page saved with a .pdf extension) rather than a
  # genuine PDF.
  min_valid_pdf_bytes: 2048

# Full-text verification (wake evidence): reads the citing work's entire
# PDF and asks an LLM to independently judge the relationship, quoting
# full-paragraph supporting passages with page numbers. Produces a
# "proposed" finding -- never auto-applied; an agent presents it to the
# human and runs `wake override` on their behalf once accepted. See
# BACKLOG.md's provisional -> proposed -> verified lifecycle.
evidence:
  prompt_version: "evidence-3"
  max_fulltext_chars: 40000
  # When the seed paper's own PDF has been acquired, include up to this
  # many characters of its extracted full text as ground truth for what
  # the seed actually contributes (see evidence-3's system prompt). No
  # seed PDF text available -> the block is silently omitted, same as
  # pre-evidence-3 behavior.
  seed_excerpt_chars: 4000

classify:
  prompt_version: "classify-4"
  # If true (default), a citing work that still has no abstract after
  # backfill (Primo/OSTI/Semantic Scholar all missed) is given a
  # deterministic "cites" classification with no LLM call, tagged
  # low_signal: true -- see PLAN.md's "title-only short-circuit"
  # investigation: on the PVFS packet, 89% of title/venue-only works were
  # LLM-classified as "cites" anyway (mostly reproducing the prompt's own
  # fallback instruction), so skipping the call loses little signal in
  # aggregate. The other ~11% that got a real signal from a
  # self-describing title alone are lost by enabling this -- set to
  # false to have the LLM attempt every title-only work regardless.
  title_only_shortcircuit: true
  # The relationship label written by the short-circuit above. "cites" by
  # default (matches what classify-2/classify-4 already default to for
  # abstract-less works); override if a different fallback label better
  # fits an analysis where a title-only mention should count differently.
  title_only_relationship: "cites"
  # How much each relationship label counts for when ranking citing works
  # (impact.md's "Strongest Evidence" and the evidence wiki's Verified/
  # Pending ordering): score = strength * log(1 + citing work's own
  # cited_by_count). The label SET itself is fixed in code
  # (classify.py's CANONICAL_RELATIONSHIPS) because the LLM prompts spell
  # each label out as prose the model must copy verbatim -- you can only
  # reweight these seven, not add or remove one, here.
  #
  # Example: if your analysis cares more about tooling adoption than
  # domain reach, weight uses-method-from above applies-to-domain:
  #   uses-method-from: 8
  #   applies-to-domain: 4
  #
  # Editing this and re-running `wake bake` reranks the impact brief
  # immediately -- no LLM calls, no re-classification. Every one of these
  # seven keys is required (wake will refuse to start with a config that
  # adds an unknown label, drops one of the seven, or sets a
  # non-positive value).
  relationship_strength:
    applies-to-domain: 7
    uses-method-from: 6
    uses-data-from: 6
    extends: 5
    benchmarks: 3
    related: 2
    cites: 1

describe:
  prompt_version: "describe-2"
  # When the seed paper's own PDF has been acquired (wake resolve's
  # automatic fetch, or `wake seed fetch-pdf --from-pdf`), include up to
  # this many characters of its extracted full text as context for the
  # contribution paragraph, in addition to the abstract. No seed PDF text
  # available -> silently falls back to abstract-only, same as before
  # this setting existed.
  seed_excerpt_chars: 6000

report:
  top_evidence_n: 20
  high_cited_threshold: 50

# Estimate-only cost telemetry. Rates are $/1K tokens; models without an
# entry here report cost_usd_est=0.0 and are flagged unpriced=true rather
# than silently guessing. Add real rates here as they become known.
cost:
  rates_per_1k_usd: {}

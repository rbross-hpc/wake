models:
  describe: "Claude Sonnet 4.6"
  classify: "Claude Sonnet 4.6"
  pdf_abstract_extract: "Claude Sonnet 4.6"
  evidence: "Claude Sonnet 4.6"

openalex:
  rate_limit_s: 1.0
  per_page: 200
  mailto_default: "rross@anl.gov"

# Lazy abstract backfill: when a citing work selected for classification has
# no OpenAlex abstract, try these sources in order before falling back to
# title+venue-only classification. Tried once per citing work; result is
# cached in the classify sidecar (abstract_source field) so it's never
# re-fetched. OSTI first (free, no rate limit, high precision but DOE-only
# coverage); Semantic Scholar second (unauthenticated, ~100 req/5min,
# broader coverage). Both return None quickly on a miss.
abstract_backfill:
  enabled: true
  sources: [osti, semanticscholar]
  rate_limit_s:
    osti: 0.5
    semanticscholar: 1.2

# Human-driven escalation for high-value citing works that automatic
# backfill (OSTI/Semantic Scholar) couldn't recover an abstract for. See
# `wake gaps` (surface candidates) and `wake fill-abstract` (resolve one).
gaps:
  # A no-abstract work is worth surfacing to the human if its own
  # cited_by_count is at least this — below the threshold, title+venue-only
  # classification is judged good enough and not worth the escalation.
  min_cited_by_count: 20
  default_limit: 10

pdf_extract:
  max_pages: 3
  prompt_version: "pdf-abstract-1"

# PDF acquisition chain (wake fetch-pdf): tried in order, all API-based
# (no scraping publisher landing pages, no sci-hub-style sources). OSTI
# first (DOE-funded work, direct PDF, no auth wall); Semantic Scholar and
# Unpaywall next (broader OA aggregation, some URLs 403 bot downloads);
# arXiv for preprints; CORE last and optional (needs CORE_API_KEY, silently
# skipped if unset). On full failure, returns human-actionable links
# instead (Unpaywall lookup page, Google Scholar search, publisher DOI,
# CORE search).
pdf_fetch:
  sources: [osti, semanticscholar, unpaywall, springer, arxiv, core]
  rate_limit_s:
    osti: 0.5
    semanticscholar: 1.2
    unpaywall: 0.5
    springer: 0.5
    arxiv: 3.0
    core: 1.0
  download_timeout_s: 30
  # A downloaded file below this size is treated as a failed fetch (e.g. an
  # HTML error/paywall page saved with a .pdf extension) rather than a
  # genuine PDF.
  min_valid_pdf_bytes: 2048

# Full-text verification (wake evidence): reads the citing work's entire
# PDF and asks an LLM to independently judge the relationship, quoting
# full-paragraph supporting passages with page numbers. Produces a
# "proposed" finding -- never auto-applied; an agent presents it to the
# human and runs `wake override` on their behalf once accepted. See
# BACKLOG.md's provisional -> proposed -> verified lifecycle.
evidence:
  prompt_version: "evidence-3"
  max_fulltext_chars: 40000
  # When the seed paper's own PDF has been acquired, include up to this
  # many characters of its extracted full text as ground truth for what
  # the seed actually contributes (see evidence-3's system prompt). No
  # seed PDF text available -> the block is silently omitted, same as
  # pre-evidence-3 behavior.
  seed_excerpt_chars: 4000

classify:
  prompt_version: "classify-2"
  # How much each relationship label counts for when ranking citing works
  # (impact.md's "Strongest Evidence" and the evidence wiki's Verified/
  # Pending ordering): score = strength * log(1 + citing work's own
  # cited_by_count). The label SET itself is fixed in code
  # (classify.py's CANONICAL_RELATIONSHIPS) because the LLM prompts spell
  # each label out as prose the model must copy verbatim -- you can only
  # reweight these seven, not add or remove one, here.
  #
  # Example: if your analysis cares more about tooling adoption than
  # domain reach, weight uses-method-from above applies-to-domain:
  #   uses-method-from: 8
  #   applies-to-domain: 4
  #
  # Editing this and re-running `wake bake` reranks the impact brief
  # immediately -- no LLM calls, no re-classification. Every one of these
  # seven keys is required (wake will refuse to start with a config that
  # adds an unknown label, drops one of the seven, or sets a
  # non-positive value).
  relationship_strength:
    applies-to-domain: 7
    uses-method-from: 6
    uses-data-from: 6
    extends: 5
    benchmarks: 3
    related: 2
    cites: 1

describe:
  prompt_version: "describe-2"
  # When the seed paper's own PDF has been acquired (wake resolve's
  # automatic fetch, or `wake seed fetch-pdf --from-pdf`), include up to
  # this many characters of its extracted full text as context for the
  # contribution paragraph, in addition to the abstract. No seed PDF text
  # available -> silently falls back to abstract-only, same as before
  # this setting existed.
  seed_excerpt_chars: 6000

report:
  top_evidence_n: 20
  high_cited_threshold: 50

# Estimate-only cost telemetry. Rates are $/1K tokens; models without an
# entry here report cost_usd_est=0.0 and are flagged unpriced=true rather
# than silently guessing. Add real rates here as they become known.
cost:
  rates_per_1k_usd: {}

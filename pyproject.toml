[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "wake"
version         = "0.1.0"
description     = "Evidence-backed impact analysis for research papers"
readme          = "README.md"
requires-python = ">=3.10"
license         = "BSD-3-Clause"
authors         = [{ name = "Robert Ross", email = "rross@anl.gov" }]
dependencies = [
    "requests>=2.31",
    "openai>=1.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "pytest-cov", "ruff", "mypy"]
pdf = ["pypdf>=4.0", "pdfplumber>=0.10"]

[project.scripts]
wake = "wake.cli.main:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["wake*"]

[tool.setuptools.package-data]
wake = ["config.yaml", "skills/impact-analysis/**/*"]

[tool.pytest.ini_options]
markers = [
    "network: marks tests that make real network calls (deselect with -m 'not network')",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled loosely; long strings/URLs are common in prompts and docs
]

[tool.mypy]
python_version = "3.10"
files = ["wake"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Baseline is intentionally lenient: wake's domain model is still dict-based
# (see PLAN.md "Phase 3 - Structural Hardening" / refactor/domain-models).
# Tighten (disallow_untyped_defs, strict_optional, etc.) as typed models land.
disallow_untyped_defs = false
no_implicit_optional = true
# Scoped to the wake/ package only -- tests are exercised for correctness
# by pytest, not for typing; adding mypy across tests/ is a separate,
# much larger cleanup with little safety payoff.
